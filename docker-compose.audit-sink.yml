# Audit sink - runs on the EXTERNAL audit machine, never beside the broker.
# Same image as the broker, different entry point. Publishes to the host's
# loopback only: a TLS proxy on that host (e.g. Caddy) fronts it on 443.
#   docker compose -f docker-compose.audit-sink.yml up -d --build
services:
  audit-sink:
    build: .
    image: regby-middleware
    container_name: regby-audit-sink
    restart: unless-stopped
    command: ["node", "dist/audit-sink/index.js"]
    env_file: .env.audit-sink
    environment:
      # Pinned like the broker's store: .env can't move the history off the mount.
      REGBY_AUDIT_DB_PATH: /audit/audit.db
      # Inside the container; the port mapping below keeps it host-local.
      REGBY_AUDIT_HOST: 0.0.0.0
      REGBY_AUDIT_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${REGBY_AUDIT_DATA_DIR:-./audit-data}:/audit
