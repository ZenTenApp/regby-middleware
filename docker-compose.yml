services:
  regby:
    build: .
    image: regby-middleware
    container_name: regby
    restart: unless-stopped
    env_file: .env
    environment:
      # Beats env_file: a stray REGBY_DB_PATH in .env can't move the store off
      # the mount. See docs/deployment.md.
      REGBY_DB_PATH: /data/regby.db
    volumes:
      # Host folder, survives `down -v` / `volume prune`. See docs/deployment.md.
      - ${REGBY_DATA_DIR:-./data}:/data
